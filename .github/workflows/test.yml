name: WorkBoard CI Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run WorkBoard Offline Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_workboard.py"

    - name: Run WorkBoard Root Resolution Tests (server + daemon)
      run: |
        python -m unittest discover -s tests -p "test_workboard_root_resolution.py"
        python -m unittest discover -s tests -p "test_daemon.py"

    - name: Run Command Guard Tests (issue #55)
      run: |
        python -m unittest discover -s tests -p "test_command_guard.py"
        python -m unittest discover -s tests -p "test_command_guard_server.py"
